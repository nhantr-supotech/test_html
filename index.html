<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
  </head>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
      margin: 0;
      padding: 16px 0;
      box-sizing: border-box;
      background: #f5f5f5;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    .card {
      position: relative;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px 24px;
      text-align: center;
      width: 320px;
      min-width: 280px;
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    @media (max-width: 360px) {
      .card {
        min-width: unset;
        padding: 24px 20px;
      }
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      color: #888;
      font-size: 18px;
    }
    .close-btn:hover {
      color: #333;
    }
    .msg-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .msg-text {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.4;
      color: #000;
      margin-top: 24px;
      width: 100%;
      word-break: break-word;
    }
    .icon-display {
      width: clamp(80px, 40vw, 128px);
      height: clamp(80px, 40vw, 128px);
    }
  </style>
  <body>
    <div class="card">
      <button
        class="close-btn"
        onclick="sendMessage('closeWebView')"
        aria-label="Close"
      >
        &#x2715;
      </button>
      <div class="msg-wrap">
        <svg class="icon-display">
          <use
            href="#{{if .success}}success-icon{{else}}fail-icon{{end}}"
          ></use>
        </svg>
        <div class="msg-text">{{.msg}}</div>
      </div>
    </div>
    <script>
      function sendMessage(action) {
        if (typeof DcomAppChannel !== "undefined")
          DcomAppChannel.postMessage(action);
        // else alert("Lỗi: Không tìm thấy kết nối với Flutter!");
      }
    </script>
  </body>
